[workspace]
resolver = "2"
members = [
    "aldur",
    "aldur-core",
    "aldur-parsers",
    "aldur-rules",
    "aldur-sarif",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/scovetta/aldur"
authors = ["Michael Scovetta"]
description = "Binary security analyzer for PE, ELF, and Mach-O binaries"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Binary parsing
goblin = "0.10.4"
pdb = "0.8"
gimli = "0.33"
object = "0.38"
scroll = "0.13"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.18.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto - using SHA-256 (secure algorithm per instructions)
sha2 = "0.10"

# Parallel processing
rayon = "1.10"

# File handling
walkdir = "2.5"
memmap2 = "0.9"
glob = "0.3"

# Archive handling
zip = "7.2"
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.6"
xz2 = "0.1"
sevenz-rust2 = "0.20"
lzma-rust2 = "0.15.7"

# Testing
tempfile = "3.14"
pretty_assertions = "1.4"

# Internal crates
aldur-core = { path = "aldur-core" }
aldur-parsers = { path = "aldur-parsers" }
aldur-rules = { path = "aldur-rules" }
aldur-sarif = { path = "aldur-sarif" }
