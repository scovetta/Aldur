# Aldur Documentation Site Configuration
# https://zensical.org/docs/

[project]
site_name = "Aldur"
site_description = "Binary security analyzer for PE, ELF, and Mach-O binaries"
site_url = "https://scovetta.github.io/aldur/"
repo_url = "https://github.com/scovetta/aldur"
repo_name = "scovetta/aldur"
edit_uri = "edit/main/docs/"

[theme]
name = "material"
palette = [
    { media = "(prefers-color-scheme: light)", scheme = "default", primary = "indigo", accent = "indigo" },
    { media = "(prefers-color-scheme: dark)", scheme = "slate", primary = "indigo", accent = "indigo" }
]
features = [
    "navigation.instant",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.action.edit"
]

[theme.icon]
repo = "fontawesome/brands/github"

[extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/scovetta/aldur" }
]

[extra.css]
extra = ["stylesheets/extra.css"]

[[nav]]
title = "Home"
path = "index.md"

